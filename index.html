<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro de dados pessoais com preenchimento de endereço pela API ViaCEP." />
  <title>Cadastro de Dados Pessoais | Projeto Escolar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>Cadastro de Dados Pessoais</h1>
    <p>Preencha seus dados. O endereço é completado automaticamente pelo CEP.</p>
  </header>

  <main class="container">
    <!-- Formulário -->
    <form id="form-cadastro" class="painel" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Ex.: Maria da Silva" autocomplete="name" required />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Ex.: maria@email.com" autocomplete="email" required />
      </div>

      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" autocomplete="bday" required />
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" autocomplete="postal-code" required />
        </div>
        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" placeholder="Ex.: 120" required />
        </div>
      </div>

      <button type="submit" id="botao-enviar">Buscar endereço e cadastrar</button>
    </form>

    <!-- Mensagens de erro / carregando -->
    <div id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></div>

    <!-- Card com os dados cadastrados -->
    <section id="resultado" class="resultado" aria-live="polite"></section>

    <p class="aviso">
      🔒 Seus dados ficam apenas nesta página. Somente o CEP é enviado à API ViaCEP.
    </p>
  </main>

  <footer class="rodape">
    <p>Endereços fornecidos pela <a href="https://viacep.com.br/" target="_blank" rel="noopener">ViaCEP</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
